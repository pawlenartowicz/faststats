[package]
name = "neurostats-py"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
description = "Python binding crate for the neurostats wheel; not published to crates.io."
repository = "https://github.com/pawlenartowicz/faststats"
publish = false

[lib]
name = "_neurostats"
crate-type = ["cdylib"]

[dependencies]
# abi3-py311: one wheel per platform for every CPython >= 3.11.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
numpy = "0.29"
neurostats = { path = ".." }

[lints.clippy]
all = { level = "deny", priority = -1 }
