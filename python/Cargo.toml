[package]
name = "faststats-py"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
description = "Python binding crate for the faststats wheel (faststats.neuro); not published to crates.io."
repository = "https://github.com/pawlenartowicz/faststats"
publish = false

[lib]
name = "_faststats"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: one wheel per platform for every CPython >= 3.10.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
neurostats = { path = "../NeuroStats" }

[lints.clippy]
all = { level = "deny", priority = -1 }
