name: Release commonstats

# Publishes the commonstats crate to crates.io via Trusted Publishing (OIDC) —
# no API token stored in the repo. Triggered by a CS-v<version> tag; RobustStats
# will get its own release-robuststats.yml on RS-v<version> tags.
#
# One-time bootstrap (Trusted Publishing can't do a new crate's first publish):
#   1. cargo publish 0.1.0 manually with an API token,
#   2. on crates.io configure the trusted publisher for `commonstats`
#      (owner: pawlenartowicz, repo: faststats, workflow: release-commonstats.yml).
# After that, pushing CS-vX.Y.Z runs this and publishes automatically.
on:
  push:
    tags: ['CS-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the short-lived OIDC token for crates.io
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange OIDC for a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        working-directory: CommonStats
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
