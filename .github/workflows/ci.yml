name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# No root workspace manifest: each crate dir is built on its own. Add new
# crates to both matrices. The NeuroStats/python binding crate (neurostats-py, the
# neurostats wheel) is not a stats crate and has its own `python` job below.
jobs:
  test:
    name: build + test (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [CommonStats, NeuroStats]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo fmt --all -- --check
      - run: cargo build --all-features
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # NeuroStats only: permutations without rayon must still build and pass.
      - run: cargo test --no-default-features --features std
        if: matrix.crate == 'NeuroStats'
      # NeuroStats only: the no_std core (TFCE, store) passes its tests
      # without `std`; the std-only integration files are gated out.
      - run: cargo test --no-default-features
        if: matrix.crate == 'NeuroStats'

  wasm:
    name: wasm32 build (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: CommonStats
            flags: --all-features
          # NeuroStats' default features pull in rayon, which needs threads the
          # target does not have; the no_std core is what must build here.
          - crate: NeuroStats
            flags: --no-default-features
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - run: cargo build ${{ matrix.flags }} --target wasm32-unknown-unknown

  python:
    name: neurostats wheel (build + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: NeuroStats/python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin develop refuses to run outside a virtualenv; VIRTUAL_ENV is what it checks.
      - run: python -m venv .venv && echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV" && echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        working-directory: NeuroStats/python
      - run: pip install "maturin>=1.15,<2" pytest numpy scipy nilearn
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: NeuroStats/python
      - run: maturin develop --release
        working-directory: NeuroStats/python
      # The nilearn oracles skip when nilearn does not import; here that must
      # be an error, not a silent skip.
      - run: python -c "import nilearn.maskers, nilearn.mass_univariate, scipy.ndimage"
      - run: pytest -q
        working-directory: NeuroStats/python
