name: Release neurostats

# Publishes neurostats on an NS-v<version> tag: the crate to crates.io (job
# `publish`) and the wheels and the sdist to PyPI (jobs `wheels`, `sdist`,
# `pypi`). Both registries use Trusted Publishing (OIDC), so no API token is
# stored in the repo. A registry version cannot be replaced: when one upload
# fails, re-run that job alone, not the whole workflow.
#
# One-time bootstrap, by hand (Trusted Publishing can't do a first publish):
#   crates.io
#     1. cargo publish the first version manually with an API token,
#     2. on crates.io configure the trusted publisher for `neurostats`
#        (owner: pawlenartowicz, repo: faststats, workflow: release-neurostats.yml).
#   PyPI
#     1. build the wheels and the sdist from NeuroStats/python and upload the first
#        version manually with an API token,
#     2. on PyPI configure the trusted publisher for `neurostats`
#        (same owner, repo and workflow).
# After that, pushing NS-vX.Y.Z runs this and publishes both automatically.
on:
  push:
    tags: ['NS-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the short-lived OIDC token for crates.io
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exchange OIDC for a crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        working-directory: NeuroStats
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
          - os: ubuntu-22.04
            target: aarch64
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # abi3-py311 (NeuroStats/python/Cargo.toml): one wheel per platform serves
      # every CPython >= 3.11. `manylinux` is ignored outside Linux.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: NeuroStats/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: NeuroStats/python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: NeuroStats/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: NeuroStats/python/dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the short-lived OIDC token for PyPI
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
